<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dengar Fokus</title>
<meta name="theme-color" content="#2457e6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{--bg:#eaf3ff;--card:#ffffff;--ink:#17224d;--mut:#51608f;--pri:#2457e6;--onpri:#ffffff;--sun:#ffc933;--onsun:#17224d;--ok:#1e9e5a;--okbg:#d9f6e6;--no:#d97706;--nobg:#ffecd1;--line:#c9d8f5;--hl:#ffe27a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1730;--card:#1a2547;--ink:#f1f5ff;--mut:#a9b6e0;--pri:#6c93ff;--onpri:#0f1730;--okbg:#14412c;--nobg:#4a3410;--line:#2f3d6e;--hl:#6b5a14}}
:root[data-theme="dark"]{--bg:#0f1730;--card:#1a2547;--ink:#f1f5ff;--mut:#a9b6e0;--pri:#6c93ff;--onpri:#0f1730;--okbg:#14412c;--nobg:#4a3410;--line:#2f3d6e;--hl:#6b5a14}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Baloo 2",ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;font-size:20px;line-height:1.35;-webkit-tap-highlight-color:transparent}
#app{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:34px;line-height:1.05;margin:8px 0 4px;font-weight:800}
h2{font-size:26px;margin:0;font-weight:800}
p.sub{color:var(--mut);margin:0 0 18px;font-size:18px}
button{font:inherit;color:inherit;cursor:pointer;border:0}
button:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
button[hidden]{display:none}
.big{display:block;width:100%;min-height:68px;border-radius:22px;background:var(--pri);color:var(--onpri);font-weight:800;font-size:24px;padding:12px 18px}
.big.sun{background:var(--sun);color:var(--onsun)}
.big.ghost{background:transparent;color:var(--ink);border:3px solid var(--line)}
.lvl{margin:20px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.star{color:#e0a800;letter-spacing:2px;font-size:22px}
.item{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:22px;padding:12px 16px;margin-bottom:10px;min-height:76px}
.item .sc{font-size:34px;min-width:84px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.back{background:var(--card);border:3px solid var(--line);border-radius:16px;min-height:48px;padding:6px 16px;font-weight:700}
.dots{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.dots i{width:16px;height:16px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--pri)}
.dots i.done{background:var(--ok)}
.stage{background:var(--card);border:3px solid var(--line);border-radius:28px;padding:18px;text-align:center}
.scene{font-size:46px;line-height:1.15;margin-bottom:8px}
.sent{font-size:25px;font-weight:700;text-align:left;padding:10px 14px;border-radius:16px;margin:6px 0;transition:background .2s}
.sent.now{background:var(--hl)}
mark{background:var(--hl);color:inherit;border-radius:8px;padding:0 6px}
.qtxt{font-size:30px;font-weight:800;line-height:1.15;margin:6px 0 14px;text-align:left}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:16px;width:100%;min-height:92px;background:var(--card);border:4px solid var(--line);border-radius:24px;padding:10px 18px;text-align:left}
.opt .vis{font-size:44px;min-width:92px;text-align:center;letter-spacing:2px}
.opt .lab{font-size:28px;font-weight:800}
.dot{display:inline-block;width:52px;height:52px;border-radius:50%;border:4px solid var(--ink);vertical-align:middle}
.opt.ok{background:var(--okbg);border-color:var(--ok)}
.opt.no{background:var(--nobg);border-color:var(--no);opacity:.55}
.opt.gone{display:none}
.msg{min-height:34px;margin:12px 0;font-weight:800;font-size:22px;text-align:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card{background:var(--sun);color:var(--onsun);border-radius:18px;min-height:84px;padding:8px 4px;font-weight:800;font-size:16px;line-height:1.1}
.card span{display:block;font-size:30px}
.card:disabled{opacity:.35;cursor:default}
.hint{background:var(--card);border:3px dashed var(--sun);border-radius:18px;padding:10px 14px;margin-top:12px;font-size:22px;font-weight:700}
.end{text-align:center}
.end .trophy{font-size:84px}
.end .star{font-size:56px}
@media (prefers-reduced-motion:no-preference){.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}}
</style>
</head>
<body>
<div id="app"></div>
<script>
var S=[],app=document.getElementById("app"),prog={},cur=null,voice=null,tok=0,audio=null,blobs={},deferred=null;
try{prog=JSON.parse(localStorage.getItem("dengar-fokus")||"{}")}catch(e){}
function save(){try{localStorage.setItem("dengar-fokus",JSON.stringify(prog))}catch(e){}}
function stars(n){return "★".repeat(n)+"☆".repeat(3-n)}

/* ---------- Suara: file mp3 (suara manusiawi) dulu, suara bawaan browser sebagai cadangan ---------- */
var TTS="speechSynthesis" in window;
function pickVoice(){if(!TTS)return;voice=speechSynthesis.getVoices().filter(function(v){return v.lang.toLowerCase().indexOf("id")===0})[0]||null}
if(TTS){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function tts(t,done){
  if(!TTS){done();return}
  var u=new SpeechSynthesisUtterance(t);u.lang="id-ID";if(voice)u.voice=voice;u.rate=.8;
  u.onend=done;u.onerror=done;speechSynthesis.speak(u);
}
function getUrl(f){
  if(blobs[f])return Promise.resolve(blobs[f]);
  return fetch("audio/"+f+".mp3").then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){if(b.size<500)throw 0;return blobs[f]=URL.createObjectURL(b)});
}
function one(it,t,done){
  getUrl(it.f).then(function(u){
    if(t!==tok)return;
    var a=new Audio(u);audio=a;a.onended=done;
    a.onerror=function(){tts(it.t,done)};
    var p=a.play();if(p&&p.catch)p.catch(function(){tts(it.t,done)});
  }).catch(function(){if(t===tok)tts(it.t,done)});
}
function stop(){tok++;if(audio){audio.pause();audio=null}if(TTS)speechSynthesis.cancel()}
function say(items,each,end){
  stop();var t=tok,i=0;
  (function next(){
    if(t!==tok)return;
    if(i>=items.length){if(end)end();return}
    if(each)each(i);
    one(items[i++],t,next);
  })();
}
function sItems(s){return s.s.map(function(t,i){return {t:t,f:s.id+"_s"+i}})}

function vis(v){return v.indexOf("c:")===0?'<span class="dot" style="background:'+v.slice(2)+'"></span>':v}

/* ---------- Layar ---------- */
function home(){
  stop();cur=null;
  var h='<h1>Dengar Fokus</h1><p class="sub">Dengarkan ceritanya, lalu jawab pertanyaannya.</p>';
  [1,2,3].forEach(function(l){
    h+='<div class="lvl"><h2>Tingkat '+l+'</h2><span class="star">'+stars(l)+'</span></div>';
    S.filter(function(s){return s.lvl===l}).forEach(function(s){
      h+='<button class="item" data-id="'+s.id+'"><span class="sc">'+Array.from(s.scene).slice(0,2).join("")+'</span><span><b>Cerita '+(S.indexOf(s)+1)+'</b><br><span class="star" style="font-size:18px">'+stars(prog[s.id]||0)+'</span></span></button>';
    });
  });
  h+='<div style="height:12px"></div><button class="big ghost" id="inst"'+(deferred?'':' hidden')+'>📲 Pasang di HP</button>';
  app.innerHTML=h;
  app.querySelectorAll(".item").forEach(function(b){b.onclick=function(){story(b.dataset.id)}});
  document.getElementById("inst").onclick=function(){if(deferred){deferred.prompt();deferred=null;this.hidden=true}};
}

function story(id){
  var s=S.filter(function(x){return x.id===id})[0];
  cur={s:s,q:0,wrong:0,help:0};
  var h='<div class="top"><button class="back" id="bk">‹ Menu</button></div><div class="stage"><div class="scene">'+s.scene+'</div>';
  s.s.forEach(function(t,i){h+='<div class="sent" id="s'+i+'">'+t+'</div>'});
  h+='</div><div style="height:14px"></div><button class="big sun" id="pl">🔊 Dengarkan cerita</button><div style="height:12px"></div><button class="big" id="go">Saya siap menjawab</button>';
  app.innerHTML=h;
  document.getElementById("bk").onclick=home;
  function clear(){app.querySelectorAll(".sent").forEach(function(e){e.classList.remove("now")})}
  document.getElementById("pl").onclick=function(){
    say(sItems(s),function(i){clear();var e=document.getElementById("s"+i);if(e){e.classList.add("now");e.scrollIntoView({block:"center",behavior:"smooth"})}},clear);
  };
  document.getElementById("go").onclick=function(){stop();ask()};
}

function ask(){
  var s=cur.s,q=s.qs[cur.q],qi={t:q.q,f:s.id+"_q"+cur.q};
  var h='<div class="top"><button class="back" id="bk">‹ Menu</button><div class="dots">';
  s.qs.forEach(function(_,i){h+='<i class="'+(i<cur.q?"done":i===cur.q?"on":"")+'"></i>'});
  h+='</div></div><div class="qtxt" id="qt">'+q.q+'</div><div class="opts">';
  q.o.forEach(function(o,i){h+='<button class="opt" data-i="'+i+'"><span class="vis">'+vis(o[1])+'</span><span class="lab">'+o[0]+'</span></button>'});
  h+='</div><div class="msg" id="msg"></div><div class="cards"><button class="card" id="c1"><span>🔁</span>Dengar lagi</button><button class="card" id="c2"><span>🔍</span>Petunjuk</button><button class="card" id="c3"><span>✂️</span>Kurangi pilihan</button></div><div id="hint"></div>';
  app.innerHTML=h;
  var msg=document.getElementById("msg");
  document.getElementById("bk").onclick=home;
  document.getElementById("qt").onclick=function(){say([qi])};
  say([qi]);
  document.getElementById("c1").onclick=function(){this.disabled=true;cur.help++;say(sItems(s))};
  document.getElementById("c2").onclick=function(){
    this.disabled=true;cur.help++;
    var key=q.k.toLowerCase(),idx=0;
    s.s.forEach(function(t,i){if(!idx&&t.toLowerCase().indexOf(key)>-1)idx=i+1});
    idx=idx?idx-1:0;
    var re=new RegExp("("+q.k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","i");
    document.getElementById("hint").innerHTML='<div class="hint">'+s.s[idx].replace(re,"<mark>$1</mark>")+'</div>';
    say([{t:s.s[idx],f:s.id+"_s"+idx}]);
  };
  document.getElementById("c3").onclick=function(){
    this.disabled=true;cur.help++;
    var wrong=[].slice.call(app.querySelectorAll(".opt")).filter(function(b){return +b.dataset.i!==q.a&&!b.classList.contains("no")});
    if(wrong.length>1)wrong[wrong.length-1].classList.add("gone");
  };
  app.querySelectorAll(".opt").forEach(function(b){
    b.onclick=function(){
      var i=+b.dataset.i;
      if(i===q.a){
        b.classList.add("ok");msg.textContent="Hebat! 🎉";
        app.querySelectorAll(".opt,.card").forEach(function(x){x.disabled=true});
        say([{t:"Hebat!",f:"ok"}]);
        setTimeout(function(){cur.q++;cur.q<s.qs.length?ask():finish()},1300);
      }else{
        cur.wrong++;b.classList.add("no","shake");b.disabled=true;
        msg.textContent="Belum tepat. Coba lagi atau pakai kartu bantu 💡";
      }
    };
  });
}

function finish(){
  var s=cur.s,n=(cur.wrong===0&&cur.help===0)?3:(cur.wrong<=1||cur.help<=2)?2:1;
  if((prog[s.id]||0)<n){prog[s.id]=n;save()}
  var nx=S[S.indexOf(s)+1];
  var h='<div class="end"><div class="trophy">🏆</div><h1>Selesai!</h1><div class="star">'+stars(n)+'</div><p class="sub">Terima kasih sudah mendengarkan dengan baik.</p></div><button class="big sun" id="again">Main lagi</button><div style="height:12px"></div>';
  if(nx)h+='<button class="big" id="next">Cerita berikutnya</button><div style="height:12px"></div>';
  h+='<button class="big ghost" id="mn">Menu</button>';
  app.innerHTML=h;
  document.getElementById("again").onclick=function(){story(s.id)};
  if(nx)document.getElementById("next").onclick=function(){story(nx.id)};
  document.getElementById("mn").onclick=home;
  say([{t:"Selesai! Kamu hebat.",f:"done"}]);
}

/* ---------- Mulai & PWA ---------- */
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();deferred=e;var b=document.getElementById("inst");if(b)b.hidden=false});
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
fetch("stories.json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){S=d.stories;home()}).catch(function(){
  app.innerHTML='<h1>Dengar Fokus</h1><p class="sub">Cerita belum bisa dimuat. Buka app lewat alamat hosting (https) atau server lokal, bukan langsung dari file.</p>';
});
</script>
</body>
</html>
